name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: 98.70.26.135
          username: azureuser
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd ~/test-express
            git pull origin main
            npm install
            npm run build
            pm2 restart test-express
